commands:
  node:
    description: "Node.JS Service"

  node.list:
    description: "List all installed packages"
    messages:
      summary: "There are {count} packages installed."
      package-not-exist: "Package directory does not exist"

  node.install:
    description: "Install a new package"
    options:
      package: "Package name"
      version: "Version of the package (defaults to latest)"
    messages:
      success: "Installation successful: {version}"
      failure: "Installation failed: {err}"

  node.info:
    description: "Show package information"
    options:
      package: "Package name"
      version: "Version of the package (defaults to latest)"
    messages:
      not-exist: "Package {name} does not exist"

  node.remove:
    description: "Remove a package"
    options:
      package: "Package name"
      version: "Version of the package (defaults to *)"
    messages:
      success: "Removal successful"
      not-exist: "Package {name} does not exist"

  node.exec:
    description: "Import a package and run JavaScript"
    options:
      package: "Package name"
      code: "Code to run"
      version: "Version of the package (defaults to latest)"
      as: "Variable name for the imported package"
      return: "Whether to return the result directly without converting to a string"
    messages:
      runtime-error: "Runtime error: {err}"

_config:
  packagePath: "Location to store packages"
  registry: "NPM registry URL, defaults to the same as Koishi"
